name: Deploy website to HostiMan

# Production updates require an explicit action in GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Я проверил предпросмотр и разрешаю публикацию на Hostiman"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-hostiman
  # Let a running FTP mirror finish; interrupted uploads may leave partial assets.
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require checked approval and verified preview for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMED: ${{ inputs.confirm_publish }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ] || [ "$CONFIRMED" != "true" ]; then
            echo "::error::Use main and check the manual publication confirmation."
            exit 1
          fi
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=preview-site-$GITHUB_SHA&per_page=100"
          artifacts="$(curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$url")"
          if ! printf '%s' "$artifacts" | jq -e --arg sha "$GITHUB_SHA" \
              '[.artifacts[]? | select(.expired == false and .workflow_run.head_sha == $sha)] | length > 0' >/dev/null; then
            echo "::error::No preview build artifact for commit $GITHUB_SHA. Run 'Preview sites (automatic)' first."
            exit 1
          fi
          echo "Manual approval recorded; matching preview artifact confirmed for $GITHUB_SHA."


      - name: Build shared site header
        run: python3 scripts/render-header.py

      - name: Check HostiMan FTP settings
        env:
          FTP_HOST: ${{ secrets.HOSTIMAN_FTP_HOST }}
          FTP_PORT: ${{ secrets.HOSTIMAN_FTP_PORT }}
          FTP_USER: ${{ secrets.HOSTIMAN_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTIMAN_FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" || { echo "Missing HOSTIMAN_FTP_HOST"; exit 1; }
          test -n "$FTP_PORT" || { echo "Missing HOSTIMAN_FTP_PORT"; exit 1; }
          test -n "$FTP_USER" || { echo "Missing HOSTIMAN_FTP_USER"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing HOSTIMAN_FTP_PASSWORD"; exit 1; }

      - name: Copy firmware version history into website
        run: cp firmware/Version.txt website/public/Version.txt

      - name: Check Fiery Lamp Control files
        run: |
          test -s "website/public/Fiery Lamp Control/FieryLampControl.exe"
          test -s "website/public/Fiery Lamp Control/FieryLampControl.ipa"

      - name: Validate voice archives
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          for name in ("time", "weather"):
              path = Path("website/public/archives") / f"{name}.zip"
              with ZipFile(path) as archive:
                  names = archive.namelist()
                  mp3_files = [entry for entry in names if entry.lower().endswith(".mp3")]
                  print(f"{path}: {len(mp3_files)} MP3 files; first entries: {names[:5]}")
                  if not mp3_files:
                      raise RuntimeError(f"{path}: No MP3 files found")
                  bad_entry = archive.testzip()
                  if bad_entry is not None:
                      raise RuntimeError(f"{path}: Damaged ZIP entry {bad_entry}")
          PY

      - name: Validate registration PHP
        run: php -l website/public/api/index.php

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Optimize connection diagram
        run: |
          python3 -m venv .image-tools
          .image-tools/bin/python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          .image-tools/bin/python scripts/optimize-images.py

      - name: Deploy website/public to HostiMan
        env:
          FTP_HOST: ${{ secrets.HOSTIMAN_FTP_HOST }}
          FTP_PORT: ${{ secrets.HOSTIMAN_FTP_PORT }}
          FTP_USER: ${{ secrets.HOSTIMAN_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTIMAN_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<'LFTP_COMMANDS'
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 20
          set mirror:parallel-transfer-count 1
          mirror --reverse --delete --verbose \
            --exclude-glob .well-known/** \
            --exclude-glob .htaccess \
            website/public/ /
          bye
          LFTP_COMMANDS

      - name: Verify archive download URLs
        run: |
          for archive in time weather; do
            url="https://fieryledlamp.ru/archives/${archive}.zip"
            status="$(curl --silent --show-error --location --head --retry 2 --max-time 25 --output /dev/null --write-out '%{http_code}' "$url")"
            echo "$url - HTTP $status"
            if [ "$status" != "200" ]; then
              echo "::error::Archive download URL is unavailable: $url (HTTP $status)"
              exit 1
            fi
          done
