name: Deploy website to HostiMan

on:
  push:
    branches:
      - main
    paths:
      - "website/public/**"
      - "index.html"
      - "app.js"
      - "config.js"
      - "style.css"
      - "firmware/**"
      - ".github/workflows/deploy-hostiman.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostiman
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check HostiMan FTP settings
        env:
          FTP_HOST: ${{ secrets.HOSTIMAN_FTP_HOST }}
          FTP_PORT: ${{ secrets.HOSTIMAN_FTP_PORT }}
          FTP_USER: ${{ secrets.HOSTIMAN_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTIMAN_FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" || { echo "Missing HOSTIMAN_FTP_HOST"; exit 1; }
          test -n "$FTP_PORT" || { echo "Missing HOSTIMAN_FTP_PORT"; exit 1; }
          test -n "$FTP_USER" || { echo "Missing HOSTIMAN_FTP_USER"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing HOSTIMAN_FTP_PASSWORD"; exit 1; }

      - name: Prepare unified website
        run: |
          rm -rf .deploy
          mkdir -p .deploy/firmware
          cp -a website/public/. .deploy/

          # Web Flasher page lives directly under the main domain:
          # https://fieryledlamp.ru/firmware.html
          sed \
            -e 's#href="./style.css"#href="/firmware/style.css"#' \
            -e 's#src="./app.js"#src="/firmware/app.js"#' \
            index.html > .deploy/firmware.html

          # Flasher assets and firmware package
          cp app.js config.js style.css .deploy/firmware/
          cp -a firmware/. .deploy/firmware/

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy unified website to HostiMan
        env:
          FTP_HOST: ${{ secrets.HOSTIMAN_FTP_HOST }}
          FTP_PORT: ${{ secrets.HOSTIMAN_FTP_PORT }}
          FTP_USER: ${{ secrets.HOSTIMAN_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTIMAN_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<'LFTP_COMMANDS'
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 20
          set mirror:parallel-transfer-count 1
          mirror --reverse --delete --verbose \
            --exclude-glob .well-known/** \
            --exclude-glob .htaccess \
            .deploy/ /
          bye
          LFTP_COMMANDS
