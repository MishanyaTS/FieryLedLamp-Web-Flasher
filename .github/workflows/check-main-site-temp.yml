name: Check main site temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-main-site-temp.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check main site
        shell: bash
        run: |
          set +e
          echo "=== DNS ==="
          dig +short A fieryledlamp.ru
          dig +short AAAA fieryledlamp.ru
          echo "=== HTTPS ==="
          curl -sSIL --max-time 20 https://fieryledlamp.ru | sed -n '1,20p'
          echo "=== BODY ==="
          curl -sS --max-time 20 https://fieryledlamp.ru | head -c 500
          echo
