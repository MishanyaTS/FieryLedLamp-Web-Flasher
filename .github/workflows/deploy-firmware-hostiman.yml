name: Deploy firmware site to HostiMan

on:
  push:
    branches:
      - main
    paths:
      - "firmware/**"
      - ".github/workflows/deploy-firmware-hostiman.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firmware-hostiman
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload firmware.fieryledlamp.ru
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check HostiMan FTP settings
        env:
          FTP_HOST: ${{ secrets.HOSTIMAN_FTP_HOST }}
          FTP_PORT: ${{ secrets.HOSTIMAN_FTP_PORT }}
          FTP_USER: ${{ secrets.HOSTIMAN_FIRMWARE_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTIMAN_FIRMWARE_FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" || { echo "Missing HOSTIMAN_FTP_HOST"; exit 1; }
          test -n "$FTP_PORT" || { echo "Missing HOSTIMAN_FTP_PORT"; exit 1; }
          test -n "$FTP_USER" || { echo "Missing HOSTIMAN_FIRMWARE_FTP_USER"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing HOSTIMAN_FIRMWARE_FTP_PASSWORD"; exit 1; }

      - name: Prepare firmware site
        env:
          STATS_ADMIN_USER: ${{ secrets.STATS_ADMIN_USER }}
          STATS_ADMIN_PASSWORD: ${{ secrets.STATS_ADMIN_PASSWORD }}
        run: |
          rm -rf .deploy-firmware
          mkdir -p .deploy-firmware
          cp -a firmware/. .deploy-firmware/

          USER_B64=""
          PASS_SHA=""
          if [ -n "$STATS_ADMIN_USER" ] && [ -n "$STATS_ADMIN_PASSWORD" ]; then
            USER_B64="$(printf '%s' "$STATS_ADMIN_USER" | base64 -w0)"
            PASS_SHA="$(printf '%s' "$STATS_ADMIN_PASSWORD" | sha256sum | awk '{print $1}')"
          fi

          cat > .deploy-firmware/stats-config.php <<EOF
          <?php
          return [
              'user_b64' => '$USER_B64',
              'password_sha256' => '$PASS_SHA',
          ];
          EOF

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy firmware folder as site root
        env:
          FTP_HOST: ${{ secrets.HOSTIMAN_FTP_HOST }}
          FTP_PORT: ${{ secrets.HOSTIMAN_FTP_PORT }}
          FTP_USER: ${{ secrets.HOSTIMAN_FIRMWARE_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTIMAN_FIRMWARE_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<'LFTP_COMMANDS'
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 20
          set mirror:parallel-transfer-count 1
          mirror --reverse --delete --verbose \
            --exclude-glob stats-data.php \
            .deploy-firmware/ /
          bye
          LFTP_COMMANDS
