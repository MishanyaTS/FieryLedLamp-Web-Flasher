name: Deploy firmware site to HostiMan

on:
  push:
    branches:
      - main
    paths:
      - "firmware/**"
      - "website/shared/**"
      - "website/public/header-search.json"
      - "scripts/render-header.py"
      - ".github/workflows/deploy-firmware-hostiman.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-firmware-hostiman
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload firmware.fieryledlamp.ru
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build shared site header
        run: python3 scripts/render-header.py

      - name: Check HostiMan FTP settings
        env:
          FTP_HOST: ${{ secrets.HOSTIMAN_FTP_HOST }}
          FTP_PORT: ${{ secrets.HOSTIMAN_FTP_PORT }}
          FTP_USER: ${{ secrets.HOSTIMAN_FIRMWARE_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTIMAN_FIRMWARE_FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" || { echo "Missing HOSTIMAN_FTP_HOST"; exit 1; }
          test -n "$FTP_PORT" || { echo "Missing HOSTIMAN_FTP_PORT"; exit 1; }
          test -n "$FTP_USER" || { echo "Missing HOSTIMAN_FIRMWARE_FTP_USER"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing HOSTIMAN_FIRMWARE_FTP_PASSWORD"; exit 1; }

      - name: Validate firmware site before upload
        run: |
          test -s firmware/index.html
          test -s firmware/app.js
          test -s firmware/config.js
          test -s firmware/update/versions.php
          test -s firmware/update/download.php
          php -l firmware/update/versions.php
          php -l firmware/update/download.php

      - name: Prepare firmware site
        run: |
          rm -rf .deploy-firmware
          mkdir -p .deploy-firmware
          cp -a firmware/. .deploy-firmware/

      - name: Deploy firmware folder as site root
        env:
          FTP_HOST: ${{ secrets.HOSTIMAN_FTP_HOST }}
          FTP_PORT: ${{ secrets.HOSTIMAN_FTP_PORT }}
          FTP_USER: ${{ secrets.HOSTIMAN_FIRMWARE_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTIMAN_FIRMWARE_FTP_PASSWORD }}
          DEPLOY_BEFORE_SHA: ${{ github.event.before }}
          DEPLOY_AFTER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import posixpath
          import subprocess
          from pathlib import Path

          host = os.environ["FTP_HOST"]
          port = int(os.environ.get("FTP_PORT", "21"))
          user = os.environ["FTP_USER"]
          password = os.environ["FTP_PASSWORD"]
          local_root = Path(".deploy-firmware")
          preserve = {".well-known", ".htaccess"}

          ftp = ftplib.FTP(timeout=30)
          ftp.connect(host, port)
          ftp.login(user, password)
          ftp.set_pasv(True)

          def list_dir(path):
              try:
                  return [(name, facts) for name, facts in ftp.mlsd(path)
                          if name not in (".", "..") and facts.get("type") not in ("cdir", "pdir")]
              except Exception:
                  names = ftp.nlst(path)
                  out = []
                  for name in names:
                      base = posixpath.basename(name.rstrip("/"))
                      if base in (".", ".."):
                          continue
                      out.append((base, {"type": "unknown"}))
                  return out

          def ensure_dir(remote_dir):
              if remote_dir in ("", "/"):
                  return
              parts = [p for p in remote_dir.split("/") if p]
              cur = ""
              for part in parts:
                  cur += "/" + part
                  try:
                      ftp.mkd(cur)
                  except ftplib.error_perm as e:
                      if not str(e).startswith("550"):
                          raise

          def upload_file(local_file, remote_file):
              ensure_dir(posixpath.dirname(remote_file))
              with local_file.open("rb") as fh:
                  ftp.storbinary(f"STOR {remote_file}", fh, blocksize=1024 * 256)
              print(f"Uploaded {remote_file}")

          def remote_type(path):
              try:
                  old = ftp.pwd()
                  ftp.cwd(path)
                  ftp.cwd(old)
                  return "dir"
              except Exception:
                  return "file"

          def delete_tree(remote_path):
              if posixpath.basename(remote_path.rstrip("/")) in preserve:
                  return
              if remote_type(remote_path) == "dir":
                  for name, facts in list_dir(remote_path):
                      child = posixpath.join(remote_path, name)
                      delete_tree(child)
                  try:
                      ftp.rmd(remote_path)
                      print(f"Removed dir {remote_path}")
                  except Exception:
                      pass
              else:
                  try:
                      ftp.delete(remote_path)
                      print(f"Removed file {remote_path}")
                  except Exception:
                      pass

          local_paths = set()
          local_dirs = {"/"}

          for p in local_root.rglob("*"):
              rel = p.relative_to(local_root).as_posix()
              remote = "/" + rel
              if p.is_dir():
                  local_dirs.add(remote)
                  ensure_dir(remote)
              else:
                  local_paths.add(remote)
                  upload_file(p, remote)

          # Remove stale files/directories from the FTP root.
          def clean_remote(remote_dir="/"):
              for name, facts in list_dir(remote_dir):
                  remote = posixpath.join(remote_dir.rstrip("/"), name)
                  if not remote.startswith("/"):
                      remote = "/" + remote
                  if name in preserve and remote_dir == "/":
                      continue
                  # Version archives can be uploaded manually through HostiMan.
                  # Never delete archived Web Flasher releases or OTA updates.
                  if remote in ("/update", "/new_version"):
                      continue
                  is_dir = facts.get("type") == "dir"
                  if facts.get("type") == "unknown":
                      is_dir = remote_type(remote) == "dir"

                  if is_dir:
                      if remote not in local_dirs:
                          delete_tree(remote)
                      else:
                          clean_remote(remote)
                  elif remote not in local_paths:
                      try:
                          ftp.delete(remote)
                          print(f"Removed stale file {remote}")
                      except Exception:
                          pass

          clean_remote("/")

          # The /update and /new_version folders may also contain large ZIPs
          # uploaded directly to HostiMan, not committed to GitHub. A blanket
          # mirror --delete would remove those live releases. Instead, remove
          # ONLY files explicitly deleted from GitHub in this push.
          before = os.environ.get("DEPLOY_BEFORE_SHA", "").strip()
          after = os.environ.get("DEPLOY_AFTER_SHA", "").strip()
          deleted_paths = []
          if before and before != "0" * 40 and after:
              result = subprocess.run(
                  ["git", "diff", "--no-renames", "--diff-filter=D",
                   "--name-only", "-z", before, after, "--", "firmware/"],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True
              )
              deleted_paths = [
                  p.decode("utf-8", errors="surrogateescape")
                  for p in result.stdout.split(b"\0") if p
              ]
          else:
              print("No push comparison available; ordinary stale file cleanup still ran.")

          removed = []
          for git_path in deleted_paths:
              if not git_path.startswith("firmware/"):
                  continue
              rel = git_path[len("firmware/"):]
              # Only server-only-archive directories need this extra cleanup;
              # ordinary site files are handled by clean_remote above.
              if not rel.startswith(("update/", "new_version/")):
                  continue
              parts = rel.split("/")
              if not parts or any(p in ("", ".", "..") for p in parts):
                  raise RuntimeError(f"Unsafe Git path: {git_path!r}")
              remote = "/" + rel
              if remote in local_paths or remote in local_dirs:
                  continue
              try:
                  ftp.delete(remote)
                  print(f"Removed Git-deleted file {remote}")
                  removed.append(remote)
              except ftplib.error_perm as error:
                  # FTP 550 can mean both "not found" and "permission denied".
                  # Verify the parent listing instead of silently hiding errors.
                  parent = posixpath.dirname(remote)
                  try:
                      still_exists = any(
                          name == posixpath.basename(remote)
                          for name, _ in list_dir(parent)
                      )
                  except ftplib.error_perm:
                      if remote_type(parent) == "dir":
                          raise RuntimeError(
                              f"Cannot verify removal of {remote}: {error}"
                          ) from error
                      still_exists = False
                  if still_exists:
                      raise RuntimeError(
                          f"Failed to delete Git-deleted file {remote}: {error}"
                      ) from error
                  print(f"Already absent: {remote}")

          # Remove only now-empty parent directories. rmd fails harmlessly when
          # a version folder contains a manual update.zip or other live files.
          parents = set()
          for remote in removed:
              directory = posixpath.dirname(remote)
              while directory not in ("/", "/update", "/new_version", ""):
                  parents.add(directory)
                  directory = posixpath.dirname(directory)
          for directory in sorted(parents, key=lambda p: p.count("/"), reverse=True):
              try:
                  ftp.rmd(directory)
                  print(f"Removed empty directory {directory}")
              except ftplib.error_perm:
                  pass

          ftp.quit()
          PY
