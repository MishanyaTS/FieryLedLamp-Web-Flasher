name: Build HostiMan packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build shared site header
        run: python3 scripts/render-header.py

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy
          (
            cd website/public
            zip -r ../../deploy/fieryledlamp-site.zip .
          )
          (
            cd firmware
            zip -r ../deploy/fieryledlamp-firmware.zip .
          )

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: hostiman-packages
          path: deploy/*.zip
          if-no-files-found: error
          retention-days: 7
