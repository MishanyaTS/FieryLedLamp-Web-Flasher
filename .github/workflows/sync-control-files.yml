name: Sync Fiery Lamp Control files into repository

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-control-files.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current Windows and iOS files
        run: |
          set -e
          mkdir -p "website/public/Fiery Lamp Control"

          curl --fail --location --retry 3 --retry-delay 2 \
            -o "website/public/Fiery Lamp Control/FieryLampControl.exe" \
            "https://github.com/MishanyaTS/Fiery_Lamp_Control/releases/download/Fiery_Lamp_Control_Update/FieryLampControl.exe"

          curl --fail --location --retry 3 --retry-delay 2 \
            -o "website/public/Fiery Lamp Control/FieryLampControl.ipa" \
            "https://github.com/MishanyaTS/Fiery_Lamp_Control/releases/download/Fiery_Lamp_Control/FieryLampControl.ipa"

          test -s "website/public/Fiery Lamp Control/FieryLampControl.exe"
          test -s "website/public/Fiery Lamp Control/FieryLampControl.ipa"

      - name: Commit files into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "website/public/Fiery Lamp Control/FieryLampControl.exe" "website/public/Fiery Lamp Control/FieryLampControl.ipa"

          if git diff --cached --quiet; then
            echo "Files are already up to date."
            exit 0
          fi

          git commit -m "Store Fiery Lamp Control binaries in website folder"
          git push origin HEAD:main
