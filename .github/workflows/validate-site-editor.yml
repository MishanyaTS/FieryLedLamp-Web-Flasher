name: Validate Site Editor

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/validate-site-editor.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l website/public/api/index.php
      - name: JavaScript syntax
        run: node --check website/public/admin-editor.js
      - name: Editor files
        run: |
          test -f website/public/admin-editor.html
          grep -q "admin-editor-files" website/public/api/index.php
          grep -q "admin-editor-load" website/public/api/index.php
          grep -q "admin-editor-save" website/public/api/index.php
          grep -q "Сохранить в GitHub" website/public/admin-editor.html
