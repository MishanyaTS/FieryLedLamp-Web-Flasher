name: Seed firmware package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seed-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download verified working update.zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware
          curl -fL --retry 3 --retry-delay 2 \
            -o firmware/update.zip \
            "https://raw.githubusercontent.com/MishanyaTS/FieryLedLamp/main/FieryLedLamp/update.zip"

          test "$(unzip -p firmware/update.zip bootloader.bin | sha256sum | awk '{print $1}')" = "1051ac3e564bb9368a635af94a219d01c6263dc7a89a5e132bd01fef925026a2"
          test "$(unzip -p firmware/update.zip partitions.bin | sha256sum | awk '{print $1}')" = "343b630fcde9181c6220a28032a88eff49a65411bb48e9ba0adbba0f4dba9a90"
          test "$(unzip -p firmware/update.zip boot_app0.bin | sha256sum | awk '{print $1}')" = "f94c5d786a7a8fab06ac5d10e33bf37711a6697636dc037559ea19cc410a17f0"
          test "$(unzip -p firmware/update.zip firmware.bin | sha256sum | awk '{print $1}')" = "5a31cc880c4f6afbaf1f073680acf1774d842393720f4dedb23c2409d3183a72"
          test "$(unzip -p firmware/update.zip littlefs.bin | sha256sum | awk '{print $1}')" = "135bb039671c5a4c65025397fa4b56823eab57d6ea74c1e623594591a7cc74ff"

      - name: Commit firmware into this repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/update.zip
          if git diff --cached --quiet; then
            echo "Firmware already present."
            exit 0
          fi
          git commit -m "Add working ESP32-S3 firmware package"
          git push
