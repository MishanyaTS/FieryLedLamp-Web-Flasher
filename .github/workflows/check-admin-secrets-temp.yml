name: Check admin secrets temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-admin-secrets-temp.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -n "$ADMIN_USER" ]; then echo "ADMIN_USER=present"; else echo "ADMIN_USER=missing"; fi
          if [ -n "$ADMIN_PASSWORD" ]; then echo "ADMIN_PASSWORD=present"; else echo "ADMIN_PASSWORD=missing"; fi
