name: Check HTTPS now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-https-now.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check domains
        shell: bash
        run: |
          set +e
          echo "=== MAIN ==="
          curl -sSIL --max-time 20 https://fieryledlamp.ru | sed -n '1,12p'
          echo | openssl s_client -servername fieryledlamp.ru -connect fieryledlamp.ru:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          echo "=== FIRMWARE ==="
          curl -sSIL --max-time 20 https://firmware.fieryledlamp.ru | sed -n '1,12p'
          echo | openssl s_client -servername firmware.fieryledlamp.ru -connect firmware.fieryledlamp.ru:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
