name: Check DNS temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-dns-temp.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public and authoritative DNS
        shell: bash
        run: |
          set +e
          echo "=== DEFAULT RESOLVER ==="
          dig fieryledlamp.ru A +noall +answer +comments

          echo "=== GOOGLE 8.8.8.8 ==="
          dig @8.8.8.8 fieryledlamp.ru A +noall +answer +comments
          dig @8.8.8.8 fieryledlamp.ru AAAA +noall +answer +comments
          dig @8.8.8.8 fieryledlamp.ru NS +noall +answer +comments

          echo "=== CLOUDFLARE 1.1.1.1 ==="
          dig @1.1.1.1 fieryledlamp.ru A +noall +answer +comments
          dig @1.1.1.1 fieryledlamp.ru AAAA +noall +answer +comments
          dig @1.1.1.1 fieryledlamp.ru NS +noall +answer +comments

          echo "=== AUTHORITATIVE NS ==="
          for ns in ns1.hostiman.ru ns2.hostiman.ru ns3.hostiman.ru ns4.hostiman.ru; do
            echo "--- $ns ---"
            dig @"$ns" fieryledlamp.ru A +noall +answer +comments
            dig @"$ns" fieryledlamp.ru AAAA +noall +answer +comments
          done

          echo "=== TRACE ==="
          dig +trace fieryledlamp.ru A | tail -n 40
