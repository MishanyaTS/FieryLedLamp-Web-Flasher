name: Check fieryledlamp domain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-domain.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS and TLS check
        shell: bash
        run: |
          set +e
          echo "=== NS fieryledlamp.ru ==="
          dig +short NS fieryledlamp.ru
          echo "=== A fieryledlamp.ru ==="
          dig +short A fieryledlamp.ru
          echo "=== AAAA fieryledlamp.ru ==="
          dig +short AAAA fieryledlamp.ru
          echo "=== A firmware.fieryledlamp.ru ==="
          dig +short A firmware.fieryledlamp.ru
          echo "=== AAAA firmware.fieryledlamp.ru ==="
          dig +short AAAA firmware.fieryledlamp.ru

          echo "=== HTTPS fieryledlamp.ru ==="
          curl -sSIL --max-time 20 https://fieryledlamp.ru | sed -n '1,15p'
          echo "=== CERT fieryledlamp.ru ==="
          echo | openssl s_client -servername fieryledlamp.ru -connect fieryledlamp.ru:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName

          echo "=== HTTPS firmware.fieryledlamp.ru ==="
          curl -sSIL --max-time 20 https://firmware.fieryledlamp.ru | sed -n '1,15p'
          echo "=== CERT firmware.fieryledlamp.ru ==="
          echo | openssl s_client -servername firmware.fieryledlamp.ru -connect firmware.fieryledlamp.ru:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
