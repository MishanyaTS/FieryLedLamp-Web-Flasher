<header class="fl-header" data-main-base="{{MAIN_BASE}}" data-search-index="{{ASSET_BASE}}header-search.json?v={{VERSION}}" data-auth="{{AUTH_MODE}}">
  {{SYMBOLS}}
  <div class="fl-top-panel">
    <svg class="fl-traces" viewBox="0 0 1440 108" preserveAspectRatio="none" aria-hidden="true" focusable="false"><g fill="none" stroke="#9c451c" stroke-width="1"><path d="M0 15h95l18 12h52l27 20h265l24-14h406l30-17h207l20-9h296"/><path d="M0 4h80l12 7h265l17-9M488 12h355l24 12h106l22-18h445" opacity=".4"/><path d="M0 105h1440" stroke="#f47b28" opacity=".6"/></g></svg>
    <div class="fl-shell fl-topbar">
      <a class="fl-brand" href="{{MAIN_BASE}}" aria-label="Fiery Led Lamp: главная"><svg class="fl-icon fl-brand-flame" aria-hidden="true" focusable="false"><use href="#fl-header-flame"></use></svg><span class="fl-brand-copy"><span class="fl-brand-name">Fiery Led Lamp</span><span class="fl-brand-tagline">УМНАЯ ЛАМПА С БЕСКОНЕЧНЫМИ ВОЗМОЖНОСТЯМИ</span></span></a>
      <form class="fl-search" role="search">
        <div class="fl-search-control"><input type="search" name="q" placeholder="Поиск по сайту…" aria-label="Поиск по сайту" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="fl-search-results"><button class="fl-search-submit" type="submit" aria-label="Найти"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-search"></use></svg></button></div>
      </form>
      <div class="fl-auth">
        <span class="fl-locale" aria-label="Язык сайта: русский"><span class="fl-locale-flag" aria-hidden="true"></span>RU</span>
        <a class="fl-auth-link" href="{{MAIN_BASE}}login.html" data-fl-login aria-label="Вход" title="Вход"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-user"></use></svg><span>Вход</span></a>
        <a class="fl-auth-link fl-auth-register" href="{{MAIN_BASE}}register.html" data-fl-register aria-label="Регистрация" title="Регистрация"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-user-plus"></use></svg><span>Регистрация</span></a>
      </div>
      <!-- Apply the cached display name synchronously, before the first paint.
           Anonymous users keep the already-correct "Вход" label at all times. -->
      <script>
        (function () {
          try {
            var name = sessionStorage.getItem("fiery_header_user_name");
            if (!name) return;
            var header = document.currentScript.closest(".fl-header");
            var login = header && header.querySelector("[data-fl-login]");
            if (!login) return;
            var label = login.querySelector("span");
            if (label) {
              label.textContent = name;
              label.classList.add("fl-profile-label");
            }
            var mainBase = header.dataset.mainBase || "/";
            login.href = mainBase + "account.html";
            login.title = "Мой аккаунт: " + name;
            login.setAttribute("aria-label", login.title);
            var register = header.querySelector("[data-fl-register]");
            if (register) register.hidden = true;
          } catch (_) {}
        })();
      </script>
      <button class="fl-menu-toggle" type="button" aria-expanded="false" aria-controls="fl-main-nav" aria-label="Открыть главное меню"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-menu"></use></svg><span>Меню</span></button>
    </div>
  </div>
  <div class="fl-nav-panel">
    <nav class="fl-shell fl-main-nav" id="fl-main-nav" aria-label="Главное меню">
      <div class="fl-nav-item">
        <a {{NAV:home}} href="{{MAIN_BASE}}"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-home"></use></svg><span class="fl-nav-label">Главная</span></a>
      </div>
      <div class="fl-nav-item">
        <a {{NAV:instruction}} href="{{MAIN_BASE}}instruction.html"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-book"></use></svg><span class="fl-nav-label">Инструкция</span></a>
      </div>
      <div class="fl-nav-item fl-has-subnav">
        <a {{NAV:setup}} href="{{MAIN_BASE}}setup.html"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-rocket"></use></svg><span class="fl-nav-label">Начало<br>работы</span></a>
        <button class="fl-subnav-toggle" type="button" aria-label="Открыть ссылки: Начало работы" aria-expanded="false" aria-controls="fl-subnav-2"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-chevron"></use></svg></button>
        <div class="fl-subnav" id="fl-subnav-2" hidden>
          <a href="{{MAIN_BASE}}setup.html"{{CURRENT:/setup.html}}>Первый запуск</a>
          <a href="{{MAIN_BASE}}hardware.html"{{CURRENT:/hardware.html}}>Подключение оборудования</a>
        </div>
      </div>
      <div class="fl-nav-item fl-has-subnav">
        <a {{NAV:mqtt}} href="{{MAIN_BASE}}mqtt-broker.html"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-antenna"></use></svg><span class="fl-nav-label">MQTT</span></a>
        <button class="fl-subnav-toggle" type="button" aria-label="Открыть ссылки: MQTT" aria-expanded="false" aria-controls="fl-subnav-3"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-chevron"></use></svg></button>
        <div class="fl-subnav" id="fl-subnav-3" hidden>
          <a href="{{MAIN_BASE}}mqtt-broker.html"{{CURRENT:/mqtt-broker.html}}>О MQTT</a>
          <a href="{{MAIN_BASE}}mqtt-commands.html"{{CURRENT:/mqtt-commands.html}}>Все MQTT-команды</a>
        </div>
      </div>
      <div class="fl-nav-item">
        <a {{NAV:broker}} href="{{MAIN_BASE}}mqtt-wqtt.html"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-cloud"></use></svg><span class="fl-nav-label">Подключение<br>брокера</span></a>
      </div>
      <div class="fl-nav-item">
        <a {{NAV:smart-home}} href="{{MAIN_BASE}}mqtt-smart-home.html"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-smart-home"></use></svg><span class="fl-nav-label">Подключение<br>к умному дому</span></a>
      </div>
      <div class="fl-nav-item">
        <a {{NAV:control}} href="{{MAIN_BASE}}fiery-lamp-control.html"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-phone"></use></svg><span class="fl-nav-label">Fiery Lamp<br>Control</span></a>
      </div>
      <div class="fl-nav-item">
        <a {{NAV:versions}} href="{{MAIN_BASE}}versions.html"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-versions"></use></svg><span class="fl-nav-label">История<br>версий</span></a>
      </div>
      <div class="fl-nav-item">
        <a {{NAV:forum}} href="{{MAIN_BASE}}forum.html"><svg class="fl-icon " aria-hidden="true" focusable="false"><use href="#fl-header-forum"></use></svg><span class="fl-nav-label">Форум</span></a>
      </div>
      <div class="fl-nav-item">
        <a {{NAV:flasher}} href="https://firmware.fieryledlamp.ru/"><svg class="fl-icon" aria-hidden="true" focusable="false"><use href="#fl-header-flasher"></use></svg><span class="fl-nav-label">Web Flasher</span></a>
      </div>
    </nav>
  </div>
  <div class="fl-search-results" id="fl-search-results" role="listbox" aria-label="Результаты поиска" hidden></div>
</header>
